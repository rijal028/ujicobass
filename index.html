<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePixel Dual-Layer Forensic Engine</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; max-width: 760px; width: 100%; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { font-size: 1.3rem; margin-top: 0; color: #38bdf8; text-align: center; }
        .input-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
        input[type="text"], input[type="file"], textarea { width: 100%; padding: 10px; background-color: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; }
        textarea { font-family: monospace; font-size: 0.75rem; height: 70px; resize: vertical; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-register { background-color: #10b981; }
        .btn-register:hover { background-color: #059669; }
        .btn-verify { background-color: #0284c7; }
        .btn-verify:hover { background-color: #0369a1; }
        .result-box { margin-top: 20px; padding: 16px; border-radius: 8px; display: none; }
        .valid { background-color: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #34d399; }
        .tampered { background-color: rgba(245, 158, 11, 0.15); border: 1px solid #f59e0b; color: #fbbf24; }
        .invalid { background-color: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #f87171; }
        .meta-info { font-size: 0.85rem; color: #94a3b8; margin-top: 8px; line-height: 1.6; }
        .fingerprint-box { background: #020617; border: 1px dashed #38bdf8; border-radius: 6px; padding: 12px; margin-top: 14px; font-family: monospace; font-size: 0.85rem; color: #e2e8f0; }
        .fingerprint-val { color: #38bdf8; font-weight: bold; word-break: break-all; }
        .distribution-box { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px; margin-top: 10px; font-family: monospace; font-size: 0.8rem; }
        .bar-container { display: flex; height: 12px; border-radius: 3px; overflow: hidden; margin: 6px 0; }
        .bar-100 { background: #10b981; }
        .bar-50 { background: #f59e0b; }
        .bar-0 { background: #ef4444; }
    </style>
</head>
<body>

<div class="card">
    <h1>SecurePixel Dual-Layer Forensic Engine</h1>

    <div class="input-group">
        <label for="imageInput">Pilih Berkas Foto (Foto Asli Kamera / Medsos / Screenshot):</label>
        <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp" onchange="autoDetectKeyFromName()">
    </div>

    <div class="input-group">
        <label for="keyInput">Master Key (Otomatis dari nama file atau isi manual):</label>
        <input type="text" id="keyInput" placeholder="Contoh: 1788254684998_2560x1920">
    </div>

    <div class="input-group">
        <label for="baselinePassive">Baseline Passive Bitstream 65% (Hanya untuk Uji Medsos/Tamper):</label>
        <textarea id="baselinePassive" placeholder="Kosongkan jika sedang mengekstrak foto asli pertama kali. Isi dengan Base64 resmi untuk menguji foto WA/FB."></textarea>
    </div>

    <div class="btn-group">
        <button class="btn-register" onclick="processEngine('extract_native')">1. Ekstrak Segel Foto Asli (Client-Engine)</button>
        <button class="btn-verify" onclick="processEngine('verify_audit')">2. Verifikasi Foto Medsos / Audit Tamper</button>
    </div>

    <div id="resultBox" class="result-box">
        <div id="resultTitle" style="font-weight: bold; font-size: 1.1rem;"></div>
        <div id="resultMeta" class="meta-info"></div>

        <div class="fingerprint-box">
            <b>Payload Supabase Database (JSON):</b><br>
            <pre id="jsonPayload" class="fingerprint-val" style="margin: 6px 0; white-space: pre-wrap;"></pre>
        </div>
    </div>
</div>

<canvas id="canvas" style="display: none;"></canvas>

<script>
    const BLOCK_SIZE = 16; 
    const CAMERA_SCATTER_RATIO = 0.35; 

    const C = Array.from({length: BLOCK_SIZE}, () => new Float64Array(BLOCK_SIZE));
    const CT = Array.from({length: BLOCK_SIZE}, () => new Float64Array(BLOCK_SIZE));
    const invSqrtN = 1.0 / Math.sqrt(BLOCK_SIZE);
    const sqrt2DivN = Math.sqrt(2.0 / BLOCK_SIZE);

    for (let j = 0; j < BLOCK_SIZE; j++) {
        C[0][j] = invSqrtN;
        CT[j][0] = invSqrtN;
    }
    for (let i = 1; i < BLOCK_SIZE; i++) {
        for (let j = 0; j < BLOCK_SIZE; j++) {
            const val = sqrt2DivN * Math.cos(((2 * j + 1) * i * Math.PI) / (2.0 * BLOCK_SIZE));
            C[i][j] = val;
            CT[j][i] = val;
        }
    }

    function createPRNG(seed) {
        let state = Number(BigInt(seed) % 2147483647n);
        if (state <= 0) state += 2147483646;
        return function() {
            state = Number((BigInt(state) * 16807n) % 2147483647n);
            return (state - 1) / 2147483646;
        };
    }

    function deriveSubSeed(keyString, salt) {
        const combined = `${keyString}_${salt}`;
        let hash = 0;
        for (let i = 0; i < combined.length; i++) {
            hash = (31 * hash + combined.charCodeAt(i)) | 0;
        }
        return Math.abs(hash);
    }

    function fastForwardDCT(inputBlock, outputCoefficients) {
        const temp = new Float64Array(BLOCK_SIZE * BLOCK_SIZE);
        for (let i = 0; i < BLOCK_SIZE; i++) {
            for (let j = 0; j < BLOCK_SIZE; j++) {
                let sum = 0.0;
                for (let k = 0; k < BLOCK_SIZE; k++) sum += C[i][k] * inputBlock[k * BLOCK_SIZE + j];
                temp[i * BLOCK_SIZE + j] = sum;
            }
        }
        for (let i = 0; i < BLOCK_SIZE; i++) {
            for (let j = 0; j < BLOCK_SIZE; j++) {
                let sum = 0.0;
                for (let k = 0; k < BLOCK_SIZE; k++) sum += temp[i * BLOCK_SIZE + k] * CT[k][j];
                outputCoefficients[i * BLOCK_SIZE + j] = sum;
            }
        }
    }

    function autoDetectKeyFromName() {
        const fileInput = document.getElementById('imageInput');
        const keyInput = document.getElementById('keyInput');
        if (!fileInput.files[0]) return;

        const name = fileInput.files[0].name;
        const match = name.match(/IMG_(\d+)/);
        if (match && !keyInput.value) {
            keyInput.value = `${match[1]}_2560x1920`;
        }
    }

    function runEngineCore(data, width, height, targetWidth, targetHeight, keyString, isDownscaled, passiveBaselineB64) {
        const subSeed = deriveSubSeed(keyString, "PHOTO_DCT16");
        const rng = createPRNG(subSeed);

        let totalActiveAudited = 0;
        let matchedActiveBits = 0;
        let totalGapEnergy = 0.0;
        let count100 = 0, count50 = 0, count0 = 0;

        let passiveExpectedBytes = null;
        if (passiveBaselineB64) {
            const binStr = atob(passiveBaselineB64);
            passiveExpectedBytes = new Uint8Array(binStr.length);
            for (let i = 0; i < binStr.length; i++) passiveExpectedBytes[i] = binStr.charCodeAt(i);
        }

        const totalMacroblocks = (targetWidth / BLOCK_SIZE) * (targetHeight / BLOCK_SIZE);
        const extractedPassiveBytes = new Uint8Array(Math.ceil(totalMacroblocks / 8));
        let bitPointer = 0;

        let totalPassiveAudited = 0;
        let matchedPassiveBits = 0;

        const totalPixelsPerBlock = BLOCK_SIZE * BLOCK_SIZE;
        const blockLuma = new Float64Array(totalPixelsPerBlock);
        const dctCoefficients = new Float64Array(totalPixelsPerBlock);

        const scaleX = width / targetWidth;
        const scaleY = height / targetHeight;

        for (let by = 0; by < targetHeight; by += BLOCK_SIZE) {
            for (let bx = 0; bx < targetWidth; bx += BLOCK_SIZE) {
                const isSelected = rng() <= CAMERA_SCATTER_RATIO;
                const expectedBit1 = rng() > 0.5 ? 1 : 0;
                const expectedBit2 = rng() > 0.5 ? 1 : 0;

                let blockSumLuma = 0.0;

                if (!isDownscaled) {
                    for (let y = 0; y < BLOCK_SIZE; y++) {
                        const rowIdx = ((by + y) * width + bx) * 4;
                        for (let x = 0; x < BLOCK_SIZE; x++) {
                            const p = rowIdx + (x * 4);
                            const luma = 0.299 * data[p] + 0.587 * data[p + 1] + 0.114 * data[p + 2];
                            blockSumLuma += luma;
                            blockLuma[y * BLOCK_SIZE + x] = luma;
                        }
                    }
                } else {
                    for (let y = 0; y < BLOCK_SIZE; y++) {
                        const startY = (by + y) * scaleY;
                        const endY = (by + y + 1) * scaleY;
                        for (let x = 0; x < BLOCK_SIZE; x++) {
                            const startX = (bx + x) * scaleX;
                            const endX = (bx + x + 1) * scaleX;

                            let subLumaSum = 0.0;
                            let subSamples = 0;
                            const minSY = Math.max(0, Math.floor(startY));
                            const maxSY = Math.min(height - 1, Math.floor(endY));
                            const minSX = Math.max(0, Math.floor(startX));
                            const maxSX = Math.min(width - 1, Math.floor(endX));

                            for (let sy = minSY; sy <= maxSY; sy++) {
                                const rowOffset = sy * width * 4;
                                for (let sx = minSX; sx <= maxSX; sx++) {
                                    const p = rowOffset + (sx * 4);
                                    subLumaSum += 0.299 * data[p] + 0.587 * data[p + 1] + 0.114 * data[p + 2];
                                    subSamples++;
                                }
                            }
                            const luma = subSamples > 0 ? (subLumaSum / subSamples) : 128.0;
                            blockSumLuma += luma;
                            blockLuma[y * BLOCK_SIZE + x] = luma;
                        }
                    }
                }

                const avgLuma = blockSumLuma / totalPixelsPerBlock;
                let varianceSum = 0.0;
                for (let i = 0; i < totalPixelsPerBlock; i++) {
                    const diff = blockLuma[i] - avgLuma;
                    varianceSum += diff * diff;
                }
                const variance = varianceSum / totalPixelsPerBlock;

                const isVisualSafe = (avgLuma >= 25.0 && avgLuma <= 230.0) && (variance <= 1800.0);

                for (let i = 0; i < totalPixelsPerBlock; i++) {
                    blockLuma[i] -= 128.0;
                }
                fastForwardDCT(blockLuma, dctCoefficients);

                if (isSelected && isVisualSafe) {
                    // LAPISAN 1: AKTIF (35%)
                    let blockMatches = 0;

                    const c1 = dctCoefficients[2 * BLOCK_SIZE + 1];
                    const c2 = dctCoefficients[1 * BLOCK_SIZE + 2];
                    const diff1 = c1 - c2;
                    if ((diff1 > 0 ? 1 : 0) === expectedBit1) {
                        matchedActiveBits++;
                        blockMatches++;
                    }
                    totalGapEnergy += Math.abs(diff1);
                    totalActiveAudited++;

                    const c3 = dctCoefficients[3 * BLOCK_SIZE + 1];
                    const c4 = dctCoefficients[1 * BLOCK_SIZE + 3];
                    const diff2 = c3 - c4;
                    if ((diff2 > 0 ? 1 : 0) === expectedBit2) {
                        matchedActiveBits++;
                        blockMatches++;
                    }
                    totalGapEnergy += Math.abs(diff2);
                    totalActiveAudited++;

                    if (blockMatches === 2) count100++;
                    else if (blockMatches === 1) count50++;
                    else count0++;
                } else {
                    // LAPISAN 2: PASIF (65%)
                    const c1 = dctCoefficients[2 * BLOCK_SIZE + 1];
                    const c2 = dctCoefficients[1 * BLOCK_SIZE + 2];
                    const naturalBit = c1 > c2 ? 1 : 0;

                    const byteIdx = Math.floor(bitPointer / 8);
                    const bitOffset = 7 - (bitPointer % 8);

                    if (naturalBit === 1) {
                        extractedPassiveBytes[byteIdx] |= (1 << bitOffset);
                    }

                    if (passiveExpectedBytes && byteIdx < passiveExpectedBytes.length) {
                        const expBit = (passiveExpectedBytes[byteIdx] >> bitOffset) & 1;
                        if (naturalBit === expBit) matchedPassiveBits++;
                        totalPassiveAudited++;
                    }

                    bitPointer++;
                }
            }
        }

        const exactByteLength = Math.ceil(bitPointer / 8);
        const trimmed = extractedPassiveBytes.slice(0, exactByteLength);
        let binaryStr = "";
        for (let i = 0; i < trimmed.length; i++) binaryStr += String.fromCharCode(trimmed[i]);
        const generatedPassiveBase64 = btoa(binaryStr);

        return {
            activeMatchRate: totalActiveAudited > 0 ? (matchedActiveBits / totalActiveAudited) * 100 : 0,
            matchedActiveBits,
            totalActiveAudited,
            totalGapEnergy,
            count100, count50, count0,
            generatedPassiveBase64,
            totalPassiveAudited,
            matchedPassiveBits,
            passiveMatchRate: totalPassiveAudited > 0 ? (matchedPassiveBits / totalPassiveAudited) * 100 : 0
        };
    }

    function processEngine(mode) {
        const rawKeyInput = document.getElementById('keyInput').value.trim();
        const fileInput = document.getElementById('imageInput');
        const baselinePassive = document.getElementById('baselinePassive').value.trim();
        const resultBox = document.getElementById('resultBox');
        const resultTitle = document.getElementById('resultTitle');
        const resultMeta = document.getElementById('resultMeta');
        const jsonPayload = document.getElementById('jsonPayload');

        if (!rawKeyInput || !fileInput.files[0]) {
            alert('Harap pilih file foto dan pastikan Master Key terisi!');
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const w = img.naturalWidth;
                const h = img.naturalHeight;

                const canvas = document.getElementById('canvas');
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                canvas.width = w;
                canvas.height = h;
                ctx.drawImage(img, 0, 0, w, h);

                const parts = rawKeyInput.split('_');
                const dimParts = parts[parts.length - 1].split('x');
                const targetW = parseInt(dimParts[0], 10);
                const targetH = parseInt(dimParts[1], 10);

                const isExactNative = (w === targetW && h === targetH);
                const rawData = ctx.getImageData(0, 0, w, h).data;

                const res = runEngineCore(rawData, w, h, targetW, targetH, rawKeyInput, !isExactNative, baselinePassive);

                resultBox.style.display = 'block';

                if (mode === 'extract_native') {
                    resultBox.className = "result-box valid";
                    resultTitle.innerHTML = `🟢 EKSTRAKSI SELESAI (Segel Foto Asli Siap Didaftarkan)`;
                    document.getElementById('baselinePassive').value = res.generatedPassiveBase64;

                    resultMeta.innerHTML = `
                        <b>Master Key:</b> ${rawKeyInput}<br>
                        <b>Match Rate Aktif (35% PRNG):</b> ${res.activeMatchRate.toFixed(4)}%<br>
                        <b>Bitstream Pasif (65% Mikro):</b> ${res.generatedPassiveBase64.length} karakter Base64 ter-generate langsung dari piksel!
                    `;

                    const supabasePayload = {
                        master_seed: parts[0],
                        master_key: rawKeyInput,
                        channel_fingerprints: {
                            native: {
                                active_match_rate: res.activeMatchRate.toFixed(12),
                                passive_bitstream: res.generatedPassiveBase64,
                                total_gap_energy: res.totalGapEnergy.toFixed(6)
                            }
                        }
                    };
                    jsonPayload.innerText = JSON.stringify(supabasePayload, null, 2);

                } else {
                    const isOriginAuthentic = res.activeMatchRate >= 65.0;
                    const hasPassiveAudit = res.totalPassiveAudited > 0;
                    const isMicroTampered = hasPassiveAudit && res.passiveMatchRate < 90.0;

                    if (!isOriginAuthentic) {
                        resultBox.className = "result-box invalid";
                        resultTitle.innerHTML = `🔴 BUKAN KAMERA RESMI / PALSU (${res.activeMatchRate.toFixed(2)}%)`;
                    } else if (isMicroTampered) {
                        resultBox.className = "result-box tampered";
                        resultTitle.innerHTML = `🟡 ASAL RESMI, TAPI DOKUMEN DIEDIT/MANIPULASI (${res.passiveMatchRate.toFixed(2)}% Pasif)`;
                    } else {
                        resultBox.className = "result-box valid";
                        resultTitle.innerHTML = `🟢 100% TERVERIFIKASI & ASLI (${res.activeMatchRate.toFixed(2)}%)`;
                    }

                    resultMeta.innerHTML = `
                        <b>Master Key:</b> ${rawKeyInput}<br>
                        <b>Lapisan Aktif (35%):</b> ${res.matchedActiveBits} / ${res.totalActiveAudited} bits (${res.activeMatchRate.toFixed(2)}%)<br>
                        <b>Lapisan Pasif (65%):</b> ${hasPassiveAudit ? `${res.matchedPassiveBits} / ${res.totalPassiveAudited} bits (${res.passiveMatchRate.toFixed(2)}%)` : 'Baseline tidak diisi (Hanya audit makro)'}
                    `;

                    jsonPayload.innerText = JSON.stringify({
                        audit_status: isOriginAuthentic && !isMicroTampered ? "VERIFIED" : "TAMPER_DETECTED",
                        active_match: res.activeMatchRate.toFixed(6),
                        passive_match: hasPassiveAudit ? res.passiveMatchRate.toFixed(6) : null
                    }, null, 2);
                }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(fileInput.files[0]);
    }
</script>

</body>
</html>
