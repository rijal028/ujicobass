<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePixel Dual-Layer Adjacency Verifier</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; max-width: 760px; width: 100%; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { font-size: 1.4rem; margin-top: 0; color: #38bdf8; text-align: center; }
        .input-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; background-color: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; }
        button { width: 100%; padding: 12px; background-color: #0284c7; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #0369a1; }
        .result-box { margin-top: 20px; padding: 16px; border-radius: 8px; display: none; }
        .valid { background-color: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #34d399; }
        .invalid { background-color: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #f87171; }
        .meta-info { font-size: 0.85rem; color: #94a3b8; margin-top: 8px; line-height: 1.5; }
        
        .preview-box { text-align: center; margin-top: 14px; display: none; }
        .preview-img { max-width: 100%; border-radius: 6px; border: 2px solid #38bdf8; margin-top: 6px; }

        .heatmap-box { margin-top: 16px; text-align: center; display: none; }
        .heatmap-grid { display: inline-grid; grid-template-columns: repeat(16, 38px); gap: 2px; padding: 6px; background: #020617; border-radius: 8px; border: 1px solid #334155; margin-top: 6px; max-width: 100%; overflow-x: auto; }
        .heatmap-cell { width: 38px; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: bold; border-radius: 2px; cursor: default; }
        .cell-pass { background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; }
        .cell-isolated { background: rgba(245, 158, 11, 0.25); border: 1px solid rgba(245, 158, 11, 0.5); color: #fbbf24; }
        .cell-tamper { background: rgba(239, 68, 68, 0.6); border: 1px solid #ef4444; color: #fff; font-weight: 900; }

        .distribution-box { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px; margin-top: 10px; font-family: monospace; font-size: 0.8rem; }
        .bar-container { display: flex; height: 12px; border-radius: 3px; overflow: hidden; margin: 6px 0; }
        .bar-100 { background: #10b981; }
        .bar-50 { background: #f59e0b; }
        .bar-0 { background: #ef4444; }
    </style>
</head>
<body>

<div class="card">
    <h1>SecurePixel Dual-Layer Adjacency Verifier</h1>
    
    <div class="input-group">
        <label for="keyInput">Master Key (Format: TIMESTAMP_WIDTHxHEIGHT):</label>
        <input type="text" id="keyInput" placeholder="Example: 1788254684998_2560x1920">
    </div>

    <div class="input-group">
        <label for="imageInput">Select Image File (Native, WhatsApp/FB, or Screenshot):</label>
        <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp">
    </div>

    <button onclick="verifyImage()">Audit Micro-Adjacency & Integrity</button>

    <div id="previewContainer" class="preview-box">
        <span style="font-size: 0.8rem; color: #94a3b8;">Cropped Area Preview (Photo Only):</span><br>
        <img id="cropPreview" class="preview-img" alt="Cropped preview">
    </div>

    <div id="heatmapBox" class="heatmap-box">
        <span style="font-size: 0.85rem; color: #38bdf8; font-weight: bold;">Spatial Micro-Disparity Map (16x16 Grid)</span><br>
        <div id="heatmapGrid" class="heatmap-grid"></div>
    </div>

    <div id="resultBox" class="result-box">
        <div id="resultTitle" style="font-weight: bold; font-size: 1.1rem;"></div>
        <div id="resultMeta" class="meta-info"></div>
    </div>
</div>

<canvas id="canvas" style="display: none;"></canvas>

<script>
    const BLOCK_SIZE = 16; 
    const CAMERA_SCATTER_RATIO = 0.35; 
    const REGION_GRID = 16; 

    const C = Array.from({length: BLOCK_SIZE}, () => new Float64Array(BLOCK_SIZE));
    const CT = Array.from({length: BLOCK_SIZE}, () => new Float64Array(BLOCK_SIZE));
    const invSqrtN = 1.0 / Math.sqrt(BLOCK_SIZE);
    const sqrt2DivN = Math.sqrt(2.0 / BLOCK_SIZE);

    for (let j = 0; j < BLOCK_SIZE; j++) {
        C[0][j] = invSqrtN;
        CT[j][0] = invSqrtN;
    }
    for (let i = 1; i < BLOCK_SIZE; i++) {
        for (let j = 0; j < BLOCK_SIZE; j++) {
            const val = sqrt2DivN * Math.cos(((2 * j + 1) * i * Math.PI) / (2.0 * BLOCK_SIZE));
            C[i][j] = val;
            CT[j][i] = val;
        }
    }

    function createPRNG(seed) {
        let state = Number(BigInt(seed) % 2147483647n);
        if (state <= 0) state += 2147483646;
        return function() {
            state = Number((BigInt(state) * 16807n) % 2147483647n);
            return (state - 1) / 2147483646;
        };
    }

    function deriveSubSeed(keyString, salt) {
        const combined = `${keyString}_${salt}`;
        let hash = 0;
        for (let i = 0; i < combined.length; i++) {
            hash = (31 * hash + combined.charCodeAt(i)) | 0;
        }
        return Math.abs(hash);
    }

    function fastForwardDCT(inputBlock, outputCoefficients) {
        const temp = new Float64Array(BLOCK_SIZE * BLOCK_SIZE);
        for (let i = 0; i < BLOCK_SIZE; i++) {
            for (let j = 0; j < BLOCK_SIZE; j++) {
                let sum = 0.0;
                for (let k = 0; k < BLOCK_SIZE; k++) sum += C[i][k] * inputBlock[k * BLOCK_SIZE + j];
                temp[i * BLOCK_SIZE + j] = sum;
            }
        }
        for (let i = 0; i < BLOCK_SIZE; i++) {
            for (let j = 0; j < BLOCK_SIZE; j++) {
                let sum = 0.0;
                for (let k = 0; k < BLOCK_SIZE; k++) sum += temp[i * BLOCK_SIZE + k] * CT[k][j];
                outputCoefficients[i * BLOCK_SIZE + j] = sum;
            }
        }
    }

    function getLumaAt(data, width, height, x, y) {
        const px = Math.max(0, Math.min(width - 1, Math.floor(x)));
        const py = Math.max(0, Math.min(height - 1, Math.floor(y)));
        const idx = (py * width + px) * 4;
        return 0.299 * data[idx] + 0.587 * data[idx + 1] + 0.114 * data[idx + 2];
    }

    function detectExactPhotoBounds(data, width, height, canonicalAspect) {
        const exactTargetHeight = Math.round(width / canonicalAspect);
        const rowLumas = new Float64Array(height);
        for (let y = 0; y < height; y++) {
            let sum = 0.0;
            let count = 0;
            for (let x = 30; x < width - 30; x += 15) {
                const idx = (y * width + x) * 4;
                sum += 0.299 * data[idx] + 0.587 * data[idx + 1] + 0.114 * data[idx + 2];
                count++;
            }
            rowLumas[y] = count > 0 ? (sum / count) : 0;
        }

        let topY = -1;
        for (let y = 250; y < Math.floor(height * 0.65); y++) {
            if (rowLumas[y - 4] < 10 && rowLumas[y - 2] < 10 && rowLumas[y] >= 15 && rowLumas[y + 4] >= 15) {
                topY = y;
                break;
            }
        }

        if (topY <= 0) topY = Math.round((height - exactTargetHeight) / 2);

        return { x: 0, y: topY, w: width, h: exactTargetHeight };
    }

    function auditImage16x16Regional(data, width, height, targetWidth, targetHeight, keyString, isDownscaled) {
        const subSeed = deriveSubSeed(keyString, "PHOTO_DCT16");
        const rng = createPRNG(subSeed);

        const totalRegions = REGION_GRID * REGION_GRID;
        const regionAudited = new Int32Array(totalRegions);
        const regionMatched = new Int32Array(totalRegions);

        let totalAudited = 0;
        let matchedBits = 0;
        let totalGapEnergy = 0.0;

        let totalBlocksAudited = 0;
        let count100 = 0;
        let count50 = 0;
        let count0 = 0;

        const totalPixelsPerBlock = BLOCK_SIZE * BLOCK_SIZE;
        const blockLuma = new Float64Array(totalPixelsPerBlock);
        const dctCoefficients = new Float64Array(totalPixelsPerBlock);

        const scaleX = width / targetWidth;
        const scaleY = height / targetHeight;

        for (let by = 0; by < targetHeight; by += BLOCK_SIZE) {
            const rY = Math.min(REGION_GRID - 1, Math.floor((by / targetHeight) * REGION_GRID));

            for (let bx = 0; bx < targetWidth; bx += BLOCK_SIZE) {
                const rX = Math.min(REGION_GRID - 1, Math.floor((bx / targetWidth) * REGION_GRID));
                const regionIdx = rY * REGION_GRID + rX;

                const isSelected = rng() <= CAMERA_SCATTER_RATIO;
                const expectedBit1 = rng() > 0.5 ? 1 : 0;
                const expectedBit2 = rng() > 0.5 ? 1 : 0;

                if (!isSelected) continue;

                let blockSumLuma = 0.0;

                if (!isDownscaled) {
                    for (let y = 0; y < BLOCK_SIZE; y++) {
                        const rowIdx = ((by + y) * width + bx) * 4;
                        for (let x = 0; x < BLOCK_SIZE; x++) {
                            const p = rowIdx + (x * 4);
                            const luma = 0.299 * data[p] + 0.587 * data[p + 1] + 0.114 * data[p + 2];
                            blockSumLuma += luma;
                            blockLuma[y * BLOCK_SIZE + x] = luma;
                        }
                    }
                } else {
                    for (let y = 0; y < BLOCK_SIZE; y++) {
                        const startY = (by + y) * scaleY;
                        const endY = (by + y + 1) * scaleY;

                        for (let x = 0; x < BLOCK_SIZE; x++) {
                            const startX = (bx + x) * scaleX;
                            const endX = (bx + x + 1) * scaleX;

                            let subLumaSum = 0.0;
                            let subSamples = 0;

                            const minSY = Math.max(0, Math.floor(startY));
                            const maxSY = Math.min(height - 1, Math.floor(endY));
                            const minSX = Math.max(0, Math.floor(startX));
                            const maxSX = Math.min(width - 1, Math.floor(endX));

                            for (let sy = minSY; sy <= maxSY; sy++) {
                                const rowOffset = sy * width * 4;
                                for (let sx = minSX; sx <= maxSX; sx++) {
                                    const p = rowOffset + (sx * 4);
                                    subLumaSum += 0.299 * data[p] + 0.587 * data[p + 1] + 0.114 * data[p + 2];
                                    subSamples++;
                                }
                            }

                            const luma = subSamples > 0 
                                ? (subLumaSum / subSamples) 
                                : getLumaAt(data, width, height, (startX + endX) / 2.0, (startY + endY) / 2.0);

                            blockSumLuma += luma;
                            blockLuma[y * BLOCK_SIZE + x] = luma;
                        }
                    }
                }

                const avgLuma = blockSumLuma / totalPixelsPerBlock;
                if (avgLuma < 25.0 || avgLuma > 230.0) continue;

                let varianceSum = 0.0;
                for (let i = 0; i < totalPixelsPerBlock; i++) {
                    const diff = blockLuma[i] - avgLuma;
                    varianceSum += diff * diff;
                }
                const variance = varianceSum / totalPixelsPerBlock;
                if (variance > 1800.0) continue; 

                for (let i = 0; i < totalPixelsPerBlock; i++) {
                    blockLuma[i] -= 128.0;
                }

                fastForwardDCT(blockLuma, dctCoefficients);

                let blockMatches = 0;

                // Pair 1: Smooth Diagonal (2,1) vs (1,2)
                const c1 = dctCoefficients[2 * BLOCK_SIZE + 1];
                const c2 = dctCoefficients[1 * BLOCK_SIZE + 2];
                const diff1 = c1 - c2;
                const bit1 = diff1 > 0 ? 1 : 0;
                if (bit1 === expectedBit1) {
                    matchedBits++;
                    regionMatched[regionIdx]++;
                    blockMatches++;
                }
                totalGapEnergy += Math.abs(diff1);
                totalAudited++;
                regionAudited[regionIdx]++;

                // Pair 2: Harmonic Diagonal (3,1) vs (1,3)
                const c3 = dctCoefficients[3 * BLOCK_SIZE + 1];
                const c4 = dctCoefficients[1 * BLOCK_SIZE + 3];
                const diff2 = c3 - c4;
                const bit2 = diff2 > 0 ? 1 : 0;
                if (bit2 === expectedBit2) {
                    matchedBits++;
                    regionMatched[regionIdx]++;
                    blockMatches++;
                }
                totalGapEnergy += Math.abs(diff2);
                totalAudited++;
                regionAudited[regionIdx]++;

                totalBlocksAudited++;
                if (blockMatches === 2) count100++;
                else if (blockMatches === 1) count50++;
                else count0++;
            }
        }

        const avgGap = totalAudited > 0 ? (totalGapEnergy / totalAudited) : 0;
        const matchRate = totalAudited > 0 ? (matchedBits / totalAudited) * 100 : 0;

        const regionScores = [];
        let minRegionScore = 100.0;

        for (let i = 0; i < totalRegions; i++) {
            if (regionAudited[i] >= 8) {
                const score = (regionMatched[i] / regionAudited[i]) * 100;
                regionScores.push(score);
                if (score < minRegionScore) minRegionScore = score;
            } else {
                regionScores.push(matchRate);
            }
        }

        const maxDrop = matchRate - minRegionScore;

        return { 
            matchRate, 
            totalAudited, 
            matchedBits, 
            avgGap, 
            totalBlocksAudited,
            count100,
            count50,
            count0,
            regionScores,
            minRegionScore,
            maxDrop
        };
    }

    function verifyImage() {
        const rawKeyInput = document.getElementById('keyInput').value.trim();
        const fileInput = document.getElementById('imageInput');
        const resultBox = document.getElementById('resultBox');
        const resultTitle = document.getElementById('resultTitle');
        const resultMeta = document.getElementById('resultMeta');
        const previewContainer = document.getElementById('previewContainer');
        const cropPreview = document.getElementById('cropPreview');
        const heatmapBox = document.getElementById('heatmapBox');
        const heatmapGrid = document.getElementById('heatmapGrid');

        if (!rawKeyInput || !fileInput.files[0]) {
            alert('Please enter Master Key and select file!');
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const nativeWidth = img.naturalWidth;
                const nativeHeight = img.naturalHeight;

                const canvas = document.getElementById('canvas');
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                canvas.width = nativeWidth;
                canvas.height = nativeHeight;
                ctx.drawImage(img, 0, 0, nativeWidth, nativeHeight);

                const parts = rawKeyInput.split('_');
                const dimParts = parts[parts.length - 1].split('x');
                const canonicalWidth = parseInt(dimParts[0], 10);
                const canonicalHeight = parseInt(dimParts[1], 10);
                const canonicalAspect = canonicalWidth / canonicalHeight;
                const screenAspect = nativeWidth / nativeHeight;

                const isScreenshot = Math.abs(screenAspect - canonicalAspect) > 0.08;
                const rawData = ctx.getImageData(0, 0, nativeWidth, nativeHeight).data;

                let res, mode, threshold;

                if (isScreenshot) {
                    const bounds = detectExactPhotoBounds(rawData, nativeWidth, nativeHeight, canonicalAspect);

                    const cropCanvas = document.createElement('canvas');
                    cropCanvas.width = canonicalWidth;
                    cropCanvas.height = canonicalHeight;
                    const cropCtx = cropCanvas.getContext('2d');

                    cropCtx.drawImage(
                        canvas,
                        bounds.x, bounds.y, bounds.w, bounds.h,
                        0, 0, canonicalWidth, canonicalHeight
                    );

                    previewContainer.style.display = 'block';
                    cropPreview.src = cropCanvas.toDataURL('image/jpeg', 0.85);

                    const croppedData = cropCtx.getImageData(0, 0, canonicalWidth, canonicalHeight).data;
                    res = auditImage16x16Regional(croppedData, canonicalWidth, canonicalHeight, canonicalWidth, canonicalHeight, rawKeyInput, false);
                    mode = `Screenshot Auto-Cropped (${bounds.w}x${bounds.h}) &rarr; 16x16 Adjacency`;
                    threshold = 60.0;
                } else {
                    previewContainer.style.display = 'none';
                    const isExactNative = (nativeWidth === canonicalWidth && nativeHeight === canonicalHeight);

                    if (isExactNative) {
                        res = auditImage16x16Regional(rawData, nativeWidth, nativeHeight, canonicalWidth, canonicalHeight, rawKeyInput, false);
                        mode = `Direct Native Capture (${nativeWidth}x${nativeHeight}) [16x16 Adjacency]`;
                        threshold = 80.0;
                    } else {
                        res = auditImage16x16Regional(rawData, nativeWidth, nativeHeight, canonicalWidth, canonicalHeight, rawKeyInput, true);
                        mode = `Compressed Social Media (${nativeWidth}x${nativeHeight} &rarr; ${canonicalWidth}x${canonicalHeight}) [16x16 Adjacency]`;
                        threshold = 65.0;
                    }
                }

                // Render Heatmap 16x16 (256 Zona)
                heatmapBox.style.display = 'block';
                heatmapGrid.innerHTML = '';
                
                // Ambang Disparitas Anjlok Lokal:
                // Menandai zona yang skornya turun drastis dibanding rata-rata global gambar
                const dynamicDropThreshold = res.matchRate >= 94.0 ? 14.0 : Math.max(16.0, (100.0 - res.matchRate) * 0.70);
                
                const droppedMatrix = Array.from({length: REGION_GRID}, () => new Uint8Array(REGION_GRID));
                const dropValues = Array.from({length: REGION_GRID}, () => new Float32Array(REGION_GRID));

                for (let rY = 0; rY < REGION_GRID; rY++) {
                    for (let rX = 0; rX < REGION_GRID; rX++) {
                        const idx = rY * REGION_GRID + rX;
                        const score = res.regionScores[idx];
                        const drop = res.matchRate - score;
                        dropValues[rY][rX] = drop;

                        if (drop >= dynamicDropThreshold) {
                            droppedMatrix[rY][rX] = 1;
                        }
                    }
                }

                // ANALISIS KETETANGGAAN SPASIAL (Spatial Adjacency Filter)
                // Membedakan titik acak terisolasi (noise kompresi) vs pola menempel (edits/strokes)
                const isContiguousCluster = Array.from({length: REGION_GRID}, () => new Uint8Array(REGION_GRID));
                let contiguousTamperCount = 0;
                let isolatedNoiseCount = 0;

                for (let rY = 0; rY < REGION_GRID; rY++) {
                    for (let rX = 0; rX < REGION_GRID; rX++) {
                        if (droppedMatrix[rY][rX] === 1) {
                            let hasNeighbor = false;
                            
                            // Periksa 8 tetangga sekitar (radius 1)
                            for (let dy = -1; dy <= 1; dy++) {
                                for (let dx = -1; dx <= 1; dx++) {
                                    if (dx === 0 && dy === 0) continue;
                                    const ny = rY + dy;
                                    const nx = rX + dx;
                                    if (ny >= 0 && ny < REGION_GRID && nx >= 0 && nx < REGION_GRID) {
                                        if (droppedMatrix[ny][nx] === 1) {
                                            hasNeighbor = true;
                                            break;
                                        }
                                    }
                                }
                                if (hasNeighbor) break;
                            }

                            if (hasNeighbor) {
                                isContiguousCluster[rY][rX] = 1;
                                contiguousTamperCount++;
                            } else {
                                isolatedNoiseCount++;
                            }
                        }
                    }
                }

                // Render Sel Heatmap
                for (let rY = 0; rY < REGION_GRID; rY++) {
                    for (let rX = 0; rX < REGION_GRID; rX++) {
                        const idx = rY * REGION_GRID + rX;
                        const score = res.regionScores[idx];
                        const drop = dropValues[rY][rX];

                        const cell = document.createElement('div');
                        
                        if (isContiguousCluster[rY][rX] === 1) {
                            cell.className = 'heatmap-cell cell-tamper'; // Menempel berdampingan -> Merah
                        } else if (droppedMatrix[rY][rX] === 1) {
                            cell.className = 'heatmap-cell cell-isolated'; // Terpencil sendirian -> Kuning Noise
                        } else {
                            cell.className = 'heatmap-cell cell-pass'; // Normal -> Hijau
                        }

                        cell.title = `Zone (${rX+1},${rY+1}): ${Math.round(score)}% (Drop: -${drop.toFixed(1)}%)`;
                        cell.innerText = `${Math.round(score)}%`;
                        heatmapGrid.appendChild(cell);
                    }
                }

                resultBox.style.display = 'block';
                const isGloballyAuthentic = res.matchRate >= threshold;
                
                // VONIS INTEGRITAS:
                // Manipulasi dinyatakan ADA jika ditemukan minimal 2 zona anomali yang saling menempel (bergandengan)
                const isLocalTamperDetected = (contiguousTamperCount >= 2);

                if (isGloballyAuthentic && !isLocalTamperDetected) {
                    resultBox.className = "result-box valid";
                    resultTitle.innerHTML = `🟢 AUTHENTIC / VERIFIED (${res.matchRate.toFixed(2)}%)`;
                } else if (isLocalTamperDetected) {
                    resultBox.className = "result-box invalid";
                    resultTitle.innerHTML = `🔴 LOCAL TAMPERING DETECTED! (${contiguousTamperCount} contiguous damaged zones confirmed)`;
                } else {
                    resultBox.className = "result-box invalid";
                    resultTitle.innerHTML = `🔴 FORGED / UNMATCHED KEY (${res.matchRate.toFixed(2)}%)`;
                }

                const p100 = ((res.count100 / res.totalBlocksAudited) * 100).toFixed(1);
                const p50 = ((res.count50 / res.totalBlocksAudited) * 100).toFixed(1);
                const p0 = ((res.count0 / res.totalBlocksAudited) * 100).toFixed(1);

                resultMeta.innerHTML = `
                    <b>Bound Master Key:</b> ${rawKeyInput}<br>
                    <b>Audit Mode:</b> ${mode}<br>
                    <b>Audited Embedded Bits:</b> ${res.matchedBits.toLocaleString()} / ${res.totalAudited.toLocaleString()} bits<br>
                    <b>Adjacency Spatial Audit:</b> ${contiguousTamperCount} connected anomaly zone(s) | ${isolatedNoiseCount} isolated noise zone(s) tolerated<br>
                    <b>Integrity Evaluation:</b> ${isLocalTamperDetected ? '<span style="color:#f87171; font-weight:bold;">CONFIRMED TAMPER PATTERN (Connected damage cluster found)</span>' : '<span style="color:#34d399;">PASS (All drops are isolated random noise)</span>'}<br>
                    <b>Average Differential Gap:</b> ${res.avgGap.toFixed(2)}<br>

                    <div class="distribution-box">
                        <b>Macroblock Health Distribution (${res.totalBlocksAudited.toLocaleString()} blocks):</b>
                        <div class="bar-container">
                            <div class="bar-100" style="width: ${p100}%;" title="100% Match"></div>
                            <div class="bar-50" style="width: ${p50}%;" title="50% Match"></div>
                            <div class="bar-0" style="width: ${p0}%;" title="0% Match"></div>
                        </div>
                        <span style="color: #34d399;">■ 100% (Both bits): ${res.count100} (${p100}%)</span><br>
                        <span style="color: #fbbf24;">■ 50%  (1 bit intact): ${res.count50} (${p50}%)</span><br>
                        <span style="color: #f87171;">■ 0%   (Collapsed): ${res.count0} (${p0}%)</span>
                    </div>
                `;
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(fileInput.files[0]);
    }
</script>

</body>
</html>
