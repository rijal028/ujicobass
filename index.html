<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePixel Bound-Key Verifier</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; max-width: 600px; width: 100%; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { font-size: 1.4rem; margin-top: 0; color: #38bdf8; text-align: center; }
        .input-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; background-color: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; }
        button { width: 100%; padding: 12px; background-color: #0284c7; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #0369a1; }
        .result-box { margin-top: 20px; padding: 16px; border-radius: 8px; display: none; }
        .valid { background-color: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #34d399; }
        .invalid { background-color: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #f87171; }
        .meta-info { font-size: 0.85rem; color: #94a3b8; margin-top: 8px; line-height: 1.5; }
        .preview-img { max-width: 100%; border-radius: 6px; margin-top: 12px; border: 1px solid #475569; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h1>SecurePixel Authenticity Verifier</h1>
    
    <div class="input-group">
        <label for="keyInput">Master Key (Format: TIMESTAMP_WIDTHxHEIGHT):</label>
        <input type="text" id="keyInput" placeholder="Example: 1788254684998_2560x1920">
    </div>

    <div class="input-group">
        <label for="imageInput">Select Image / Screenshot File:</label>
        <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp">
    </div>

    <button onclick="verifyImage()">Verify Authenticity</button>

    <img id="cropPreview" class="preview-img" alt="Auto-crop debug preview">

    <div id="resultBox" class="result-box">
        <div id="resultTitle" style="font-weight: bold; font-size: 1.1rem;"></div>
        <div id="resultMeta" class="meta-info"></div>
    </div>
</div>

<canvas id="canvas" style="display: none;"></canvas>

<script>
    const BLOCK_SIZE = 16;
    const SCATTER_RATIO = 0.08;

    const C = Array.from({length: BLOCK_SIZE}, () => new Float64Array(BLOCK_SIZE));
    const CT = Array.from({length: BLOCK_SIZE}, () => new Float64Array(BLOCK_SIZE));
    const invSqrtN = 1.0 / Math.sqrt(BLOCK_SIZE);
    const sqrt2DivN = Math.sqrt(2.0 / BLOCK_SIZE);

    for (let j = 0; j < BLOCK_SIZE; j++) {
        C[0][j] = invSqrtN;
        CT[j][0] = invSqrtN;
    }
    for (let i = 1; i < BLOCK_SIZE; i++) {
        for (let j = 0; j < BLOCK_SIZE; j++) {
            const val = sqrt2DivN * Math.cos(((2 * j + 1) * i * Math.PI) / (2.0 * BLOCK_SIZE));
            C[i][j] = val;
            CT[j][i] = val;
        }
    }

    function createPRNG(seed) {
        let state = Number(BigInt(seed) % 2147483647n);
        if (state <= 0) state += 2147483646;
        return function() {
            state = Number((BigInt(state) * 16807n) % 2147483647n);
            return (state - 1) / 2147483646;
        };
    }

    function deriveSubSeed(keyString, salt) {
        const combined = `${keyString}_${salt}`;
        let hash = 0;
        for (let i = 0; i < combined.length; i++) {
            hash = (31 * hash + combined.charCodeAt(i)) | 0;
        }
        return Math.abs(hash);
    }

    function fastForwardDCT16(inputBlock, outputCoefficients) {
        const temp = new Float64Array(BLOCK_SIZE * BLOCK_SIZE);
        for (let i = 0; i < BLOCK_SIZE; i++) {
            for (let j = 0; j < BLOCK_SIZE; j++) {
                let sum = 0.0;
                for (let k = 0; k < BLOCK_SIZE; k++) sum += C[i][k] * inputBlock[k * BLOCK_SIZE + j];
                temp[i * BLOCK_SIZE + j] = sum;
            }
        }
        for (let i = 0; i < BLOCK_SIZE; i++) {
            for (let j = 0; j < BLOCK_SIZE; j++) {
                let sum = 0.0;
                for (let k = 0; k < BLOCK_SIZE; k++) sum += temp[i * BLOCK_SIZE + k] * CT[k][j];
                outputCoefficients[i * BLOCK_SIZE + j] = sum;
            }
        }
    }

    function getLuma(data, width, x, y) {
        const idx = (y * width + x) * 4;
        return 0.299 * data[idx] + 0.587 * data[idx + 1] + 0.114 * data[idx + 2];
    }

    // Deteksi cerdas tepi gambar riil di tengah bilah hitam
    function findActualPhotoBounds(data, width, height, targetAspect) {
        // Cek apakah ada bilah hitam khas letterbox screenshot
        // Periksa 3 sampel baris horizontal di area 25% dan 75% ketinggian layar
        function isRowDarkLetterbox(y) {
            let nonBlack = 0;
            for (let x = 60; x < width - 60; x += 20) {
                const idx = (y * width + x) * 4;
                if (data[idx] > 18 || data[idx+1] > 18 || data[idx+2] > 18) {
                    nonBlack++;
                }
            }
            return nonBlack < 4; // Lebih dari 90% piksel adalah hitam pekat
        }

        const midX = Math.floor(width / 2);
        let topEdge = -1;
        let bottomEdge = -1;

        // Cari batas atas: lewati area status bar (0-200px), cari di mana piksel hitam berubah menjadi foto
        for (let y = 180; y < Math.floor(height * 0.55); y++) {
            const isDark = isRowDarkLetterbox(y);
            const isNextDark = isRowDarkLetterbox(y + 2);
            if (isDark && !isNextDark) {
                topEdge = y + 2;
                break;
            }
        }

        // Cari batas bawah: dari 90% layar naik ke atas
        for (let y = Math.floor(height * 0.90); y > Math.floor(height * 0.45); y--) {
            const isDark = isRowDarkLetterbox(y);
            const isPrevDark = isRowDarkLetterbox(y - 2);
            if (isDark && !isPrevDark) {
                bottomEdge = y - 2;
                break;
            }
        }

        // Jika transisi terdeteksi valid
        if (topEdge > 0 && bottomEdge > topEdge && (bottomEdge - topEdge) > 200) {
            const cropH = bottomEdge - topEdge + 1;
            return {
                isScreenshot: true,
                x: 0,
                y: topEdge,
                w: width,
                h: cropH
            };
        }

        // Fallback: Gunakan estimasi aspek rasio eksak jika auto edge tidak sempurna
        const expectedH = Math.round(width / targetAspect);
        if (expectedH < height * 0.85) {
            const fallbackY = Math.round((height - expectedH) / 2);
            return {
                isScreenshot: true,
                x: 0,
                y: fallbackY,
                w: width,
                h: expectedH
            };
        }

        return { isScreenshot: false, x: 0, y: 0, w: width, h: height };
    }

    function auditImage(data, width, height, targetWidth, targetHeight, keyString) {
        const subSeed = deriveSubSeed(keyString, "PHOTO_DCT16");
        const rng = createPRNG(subSeed);

        let totalAudited = 0;
        let matchedBits = 0;
        let totalGapEnergy = 0.0;

        const totalPixelsPerBlock = BLOCK_SIZE * BLOCK_SIZE;
        const blockLuma = new Float64Array(totalPixelsPerBlock);
        const dctCoefficients = new Float64Array(totalPixelsPerBlock);

        const scaleX = width / targetWidth;
        const scaleY = height / targetHeight;

        for (let by = 0; by < targetHeight; by += BLOCK_SIZE) {
            for (let bx = 0; bx < targetWidth; bx += BLOCK_SIZE) {
                const isSelected = rng() <= SCATTER_RATIO;

                let blockSumLuma = 0.0;

                for (let y = 0; y < BLOCK_SIZE; y++) {
                    const startY = (by + y) * scaleY;
                    const endY = (by + y + 1) * scaleY;

                    for (let x = 0; x < BLOCK_SIZE; x++) {
                        const startX = (bx + x) * scaleX;
                        const endX = (bx + x + 1) * scaleX;

                        let subLumaSum = 0.0;
                        let subSamples = 0;

                        const minSY = Math.max(0, Math.floor(startY));
                        const maxSY = Math.min(height - 1, Math.floor(endY));
                        const minSX = Math.max(0, Math.floor(startX));
                        const maxSX = Math.min(width - 1, Math.floor(endX));

                        for (let sy = minSY; sy <= maxSY; sy++) {
                            const rowOffset = sy * width * 4;
                            for (let sx = minSX; sx <= maxSX; sx++) {
                                const p = rowOffset + (sx * 4);
                                subLumaSum += 0.299 * data[p] + 0.587 * data[p + 1] + 0.114 * data[p + 2];
                                subSamples++;
                            }
                        }

                        const luma = subSamples > 0 
                            ? (subLumaSum / subSamples) 
                            : getLuma(data, width, Math.floor((startX + endX) / 2), Math.floor((startY + endY) / 2));

                        blockSumLuma += luma;
                        blockLuma[y * BLOCK_SIZE + x] = luma - 128.0;
                    }
                }

                const expectedBit1 = rng() > 0.5 ? 1 : 0;
                const expectedBit2 = rng() > 0.5 ? 1 : 0;

                if (!isSelected) continue;

                const avgLuma = blockSumLuma / totalPixelsPerBlock;
                if (avgLuma < 25.0 || avgLuma > 230.0) continue;

                fastForwardDCT16(blockLuma, dctCoefficients);

                // Pair 1: (2,1) vs (1,2)
                const c1 = dctCoefficients[2 * BLOCK_SIZE + 1];
                const c2 = dctCoefficients[1 * BLOCK_SIZE + 2];
                const diff1 = c1 - c2;
                const bit1 = diff1 > 0 ? 1 : 0;
                if (bit1 === expectedBit1) matchedBits++;
                totalGapEnergy += Math.abs(diff1);
                totalAudited++;

                // Pair 2: (3,1) vs (1,3)
                const c3 = dctCoefficients[3 * BLOCK_SIZE + 1];
                const c4 = dctCoefficients[1 * BLOCK_SIZE + 3];
                const diff2 = c3 - c4;
                const bit2 = diff2 > 0 ? 1 : 0;
                if (bit2 === expectedBit2) matchedBits++;
                totalGapEnergy += Math.abs(diff2);
                totalAudited++;
            }
        }

        const avgGap = totalAudited > 0 ? (totalGapEnergy / totalAudited) : 0;
        const matchRate = totalAudited > 0 ? (matchedBits / totalAudited) * 100 : 0;

        return { matchRate, totalAudited, matchedBits, avgGap };
    }

    function verifyImage() {
        const rawKeyInput = document.getElementById('keyInput').value.trim();
        const fileInput = document.getElementById('imageInput');
        const resultBox = document.getElementById('resultBox');
        const resultTitle = document.getElementById('resultTitle');
        const resultMeta = document.getElementById('resultMeta');
        const cropPreview = document.getElementById('cropPreview');

        if (!rawKeyInput || !fileInput.files[0]) {
            alert('Please enter Master Key and select file!');
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const nativeWidth = img.naturalWidth;
                const nativeHeight = img.naturalHeight;

                const canvas = document.getElementById('canvas');
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                canvas.width = nativeWidth;
                canvas.height = nativeHeight;
                ctx.drawImage(img, 0, 0, nativeWidth, nativeHeight);

                const parts = rawKeyInput.split('_');
                const dimParts = parts[parts.length - 1].split('x');
                const canonicalWidth = parseInt(dimParts[0], 10);
                const canonicalHeight = parseInt(dimParts[1], 10);
                const canonicalAspect = canonicalWidth / canonicalHeight;

                const rawData = ctx.getImageData(0, 0, nativeWidth, nativeHeight).data;

                // Cari batas foto asli di dalam screenshot
                const bounds = findActualPhotoBounds(rawData, nativeWidth, nativeHeight, canonicalAspect);

                let res, mode, threshold;

                if (bounds.isScreenshot) {
                    const cropCanvas = document.createElement('canvas');
                    cropCanvas.width = canonicalWidth;
                    cropCanvas.height = canonicalHeight;
                    const cropCtx = cropCanvas.getContext('2d');

                    // Crop area foto murni di tengah dan rescale ke dimensi kanonik
                    cropCtx.drawImage(
                        canvas,
                        bounds.x, bounds.y, bounds.w, bounds.h,
                        0, 0, canonicalWidth, canonicalHeight
                    );

                    // Tampilkan preview foto yang berhasil di-crop agar terlihat di layar
                    cropPreview.src = cropCanvas.toDataURL();
                    cropPreview.style.display = 'block';

                    const croppedData = cropCtx.getImageData(0, 0, canonicalWidth, canonicalHeight).data;
                    res = auditImage(croppedData, canonicalWidth, canonicalHeight, canonicalWidth, canonicalHeight, rawKeyInput);
                    mode = `Screenshot Auto-Cropped (${bounds.w}x${bounds.h} @ Y:${bounds.y}) &rarr; Canonical Re-aligned (${canonicalWidth}x${canonicalHeight})`;
                    threshold = 60.0;
                } else {
                    cropPreview.style.display = 'none';
                    res = auditImage(rawData, nativeWidth, nativeHeight, canonicalWidth, canonicalHeight, rawKeyInput);
                    mode = `Direct Camera Image (${nativeWidth}x${nativeHeight})`;
                    threshold = 68.0;
                }

                resultBox.style.display = 'block';

                if (res.matchRate >= threshold) {
                    resultBox.className = "result-box valid";
                    resultTitle.innerHTML = `🟢 AUTHENTIC / VERIFIED (${res.matchRate.toFixed(2)}%)`;
                } else {
                    resultBox.className = "result-box invalid";
                    resultTitle.innerHTML = `🔴 TAMPERED / FORGED (${res.matchRate.toFixed(2)}%)`;
                }

                resultMeta.innerHTML = `
                    <b>Bound Master Key:</b> ${rawKeyInput}<br>
                    <b>Detection Mode:</b> ${mode}<br>
                    <b>Average Differential Gap:</b> ${res.avgGap.toFixed(2)}<br>
                    <b>Matched Bits:</b> ${res.matchedBits.toLocaleString()} / ${res.totalAudited.toLocaleString()} bits<br>
                    <b>Threshold:</b> &ge; ${threshold.toFixed(2)}%
                `;
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(fileInput.files[0]);
    }
</script>

</body>
</html>
