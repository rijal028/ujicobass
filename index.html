<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePixel 1-Bit Forensic Engine</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; max-width: 860px; width: 100%; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { font-size: 1.3rem; margin-top: 0; color: #38bdf8; text-align: center; }
        .input-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; background-color: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; }
        .btn-group { display: flex; gap: 10px; margin-top: 14px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-verify { background-color: #0284c7; }
        .btn-verify:hover { background-color: #0369a1; }
        .result-box { margin-top: 20px; padding: 16px; border-radius: 8px; display: none; }
        .valid { background-color: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #34d399; }
        .tampered { background-color: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #f87171; }
        .invalid { background-color: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #f87171; }
        .meta-info { font-size: 0.85rem; color: #94a3b8; margin-top: 8px; line-height: 1.6; }
        
        .preview-box { text-align: center; margin-top: 14px; display: none; }
        .preview-img { max-width: 100%; border-radius: 6px; border: 2px solid #38bdf8; margin-top: 6px; }

        .heatmap-wrapper { margin-top: 18px; text-align: center; display: none; background: #020617; border: 1px solid #334155; border-radius: 8px; padding: 14px; }
        .heatmap-canvas-container { position: relative; display: inline-block; max-width: 100%; border-radius: 6px; overflow: hidden; border: 1px solid #475569; }
        .heatmap-canvas-container canvas { display: block; max-width: 100%; height: auto; }
        #heatmapOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        .controls-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px; margin-top: 12px; font-size: 0.82rem; color: #94a3b8; }
        .controls-row label { display: inline-flex; align-items: center; gap: 6px; margin: 0; color: #f1f5f9; cursor: pointer; }

        .fingerprint-box { background: #020617; border: 1px dashed #38bdf8; border-radius: 6px; padding: 12px; margin-top: 14px; font-family: monospace; font-size: 0.85rem; color: #e2e8f0; }
        .fingerprint-val { color: #38bdf8; font-weight: bold; word-break: break-all; }
        .distribution-box { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px; margin-top: 10px; font-family: monospace; font-size: 0.8rem; }
        .bar-container { display: flex; height: 12px; border-radius: 3px; overflow: hidden; margin: 6px 0; }
        .bar-100 { background: #10b981; }
        .bar-0 { background: #ef4444; }
    </style>
</head>
<body>

<div class="card">
    <h1>SecurePixel 1-Bit Full-Surface Forensic Engine</h1>

    <div class="input-group">
        <label for="imageInput">Pilih Berkas Citra (Asli Kamera / Medsos / Screenshot):</label>
        <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp" onchange="autoDetectKeyFromName()">
    </div>

    <div class="input-group">
        <label for="keyInput">Master Key (Terdeteksi otomatis dari nama berkas):</label>
        <input type="text" id="keyInput" placeholder="Contoh: 1788519491937_3200x2400">
    </div>

    <div class="btn-group">
        <button class="btn-verify" onclick="processEngine()">Audit Integritas Forensik 1-Bit</button>
    </div>

    <div id="previewContainer" class="preview-box">
        <span style="font-size: 0.8rem; color: #38bdf8; font-weight: bold;">Area Screenshot Terpotong Geometri Simetris:</span><br>
        <img id="cropPreview" class="preview-img" alt="Cropped preview">
    </div>

    <!-- Modul Heatmap -->
    <div id="heatmapContainer" class="heatmap-wrapper">
        <div style="font-weight: bold; font-size: 0.95rem; color: #38bdf8; margin-bottom: 4px;">Peta Panas Integritas Spasial (1-Bit Orthogonal)</div>
        
        <div class="controls-row">
            <label>
                <input type="radio" name="heatmapMode" value="defects_only" checked onchange="switchHeatmapMode(this.value)">
                <b>Sorot Area Cacat / Coretan Saja (Rekomendasi)</b>
            </label>
            <label>
                <input type="radio" name="heatmapMode" value="full_grid" onchange="switchHeatmapMode(this.value)">
                Tampilkan Seluruh Grid (Termasuk Hijau)
            </label>
        </div>

        <div class="heatmap-canvas-container" style="margin-top: 10px;">
            <canvas id="photoBaseCanvas"></canvas>
            <canvas id="heatmapOverlay"></canvas>
        </div>

        <div class="controls-row">
            <span>Transparansi Kerusakan:</span>
            <input type="range" id="opacitySlider" min="0.2" max="1" step="0.05" value="0.85" oninput="updateHeatmapOpacity(this.value)">
            <span id="opacityVal">85%</span>
        </div>
    </div>

    <div id="resultBox" class="result-box">
        <div id="resultTitle" style="font-weight: bold; font-size: 1.1rem;"></div>
        <div id="resultMeta" class="meta-info"></div>

        <div class="fingerprint-box">
            <b>Payload Audit Supabase (JSON):</b><br>
            <pre id="jsonPayload" class="fingerprint-val" style="margin: 6px 0; white-space: pre-wrap;"></pre>
        </div>
    </div>
</div>

<canvas id="canvas" style="display: none;"></canvas>

<script>
    const BLOCK_SIZE = 16; 
    const CAMERA_SCATTER_RATIO = 1.00;

    const C = Array.from({length: BLOCK_SIZE}, () => new Float64Array(BLOCK_SIZE));
    const CT = Array.from({length: BLOCK_SIZE}, () => new Float64Array(BLOCK_SIZE));
    const invSqrtN = 1.0 / Math.sqrt(BLOCK_SIZE);
    const sqrt2DivN = Math.sqrt(2.0 / BLOCK_SIZE);

    for (let j = 0; j < BLOCK_SIZE; j++) {
        C[0][j] = invSqrtN;
        CT[j][0] = invSqrtN;
    }
    for (let i = 1; i < BLOCK_SIZE; i++) {
        for (let j = 0; j < BLOCK_SIZE; j++) {
            const val = sqrt2DivN * Math.cos(((2 * j + 1) * i * Math.PI) / (2.0 * BLOCK_SIZE));
            C[i][j] = val;
            CT[j][i] = val;
        }
    }

    function createPRNG(seed) {
        let state = Number(BigInt(seed) % 2147483647n);
        if (state <= 0) state += 2147483646;
        return function() {
            state = Number((BigInt(state) * 16807n) % 2147483647n);
            return (state - 1) / 2147483646;
        };
    }

    function deriveSubSeed(keyString, salt) {
        const combined = `${keyString}_${salt}`;
        let hash = 0;
        for (let i = 0; i < combined.length; i++) {
            hash = (31 * hash + combined.charCodeAt(i)) | 0;
        }
        return Math.abs(hash);
    }

    function fastForwardDCT(inputBlock, outputCoefficients) {
        const temp = new Float64Array(BLOCK_SIZE * BLOCK_SIZE);
        for (let i = 0; i < BLOCK_SIZE; i++) {
            for (let j = 0; j < BLOCK_SIZE; j++) {
                let sum = 0.0;
                for (let k = 0; k < BLOCK_SIZE; k++) sum += C[i][k] * inputBlock[k * BLOCK_SIZE + j];
                temp[i * BLOCK_SIZE + j] = sum;
            }
        }
        for (let i = 0; i < BLOCK_SIZE; i++) {
            for (let j = 0; j < BLOCK_SIZE; j++) {
                let sum = 0.0;
                for (let k = 0; k < BLOCK_SIZE; k++) sum += temp[i * BLOCK_SIZE + k] * CT[k][j];
                outputCoefficients[i * BLOCK_SIZE + j] = sum;
            }
        }
    }

    function autoDetectKeyFromName() {
        const fileInput = document.getElementById('imageInput');
        const keyInput = document.getElementById('keyInput');
        if (!fileInput.files[0]) return;

        const name = fileInput.files[0].name;
        const match = name.match(/IMG_(\d+)/);
        if (match && !keyInput.value) {
            keyInput.value = `${match[1]}_3200x2400`;
        }
    }

    function detectCenteredPhotoBounds(width, height, canonicalAspect) {
        const exactTargetHeight = Math.round(width / canonicalAspect);
        const topY = Math.max(0, Math.round((height - exactTargetHeight) / 2));

        return { 
            x: 0, 
            y: topY, 
            w: width, 
            h: exactTargetHeight 
        };
    }

    let globalMacroblockMap = [];
    let currentHeatmapMode = 'defects_only';

    function renderHeatmapLayer(opacity) {
        const overlay = document.getElementById('heatmapOverlay');
        if (!overlay || globalMacroblockMap.length === 0) return;

        const ctx = overlay.getContext('2d');
        ctx.clearRect(0, 0, overlay.width, overlay.height);

        globalMacroblockMap.forEach(blk => {
            if (blk.type === 'active') {
                if (blk.matches === 0) {
                    ctx.fillStyle = `rgba(239, 68, 68, ${opacity})`;
                    ctx.fillRect(blk.x, blk.y, BLOCK_SIZE, BLOCK_SIZE);
                    ctx.strokeStyle = "#ffffff";
                    ctx.lineWidth = 1;
                    ctx.strokeRect(blk.x, blk.y, BLOCK_SIZE, BLOCK_SIZE);
                } else if (blk.matches === 1 && currentHeatmapMode === 'full_grid') {
                    ctx.fillStyle = `rgba(16, 185, 129, ${opacity * 0.35})`;
                    ctx.fillRect(blk.x, blk.y, BLOCK_SIZE, BLOCK_SIZE);
                }
            } else if (blk.type === 'dark_sealed_tampered') {
                ctx.fillStyle = `rgba(239, 68, 68, ${opacity})`;
                ctx.fillRect(blk.x, blk.y, BLOCK_SIZE, BLOCK_SIZE);
                ctx.strokeStyle = "#fbbf24";
                ctx.lineWidth = 1.5;
                ctx.strokeRect(blk.x, blk.y, BLOCK_SIZE, BLOCK_SIZE);
            } else if (blk.type === 'skipped' && currentHeatmapMode === 'full_grid') {
                ctx.fillStyle = `rgba(100, 116, 139, ${opacity * 0.25})`;
                ctx.fillRect(blk.x, blk.y, BLOCK_SIZE, BLOCK_SIZE);
            }
        });
    }

    function switchHeatmapMode(mode) {
        currentHeatmapMode = mode;
        const opacity = parseFloat(document.getElementById('opacitySlider').value);
        renderHeatmapLayer(opacity);
    }

    function updateHeatmapOpacity(val) {
        document.getElementById('opacityVal').innerText = `${Math.round(val * 100)}%`;
        renderHeatmapLayer(parseFloat(val));
    }

    function detectTamperClusters(macroblockMap, targetWidth, targetHeight, isCompressedChannel) {
        const cols = targetWidth / BLOCK_SIZE;
        const rows = targetHeight / BLOCK_SIZE;
        const grid = Array.from({length: rows}, () => new Int8Array(cols).fill(-1));

        macroblockMap.forEach(blk => {
            const c = Math.floor(blk.x / BLOCK_SIZE);
            const r = Math.floor(blk.y / BLOCK_SIZE);
            if (r < rows && c < cols) {
                if (blk.type === 'active') grid[r][c] = blk.matches;
                else if (blk.type === 'dark_sealed_tampered') grid[r][c] = 0;
            }
        });

        let maxLocalDamageCluster = 0;
        let clusterCenter = null;

        const windowSize = 5;
        // Pada saluran kompresi medsos, abaikan 2 blok terluar (32px border margin)
        // untuk mencegah false positive akibat pemotongan/resampling tepi WhatsApp
        const borderMargin = isCompressedChannel ? 2 : 0;

        for (let r = borderMargin; r <= rows - windowSize - borderMargin; r++) {
            for (let c = borderMargin; c <= cols - windowSize - borderMargin; c++) {
                let zeroMatchesCount = 0;
                for (let dr = 0; dr < windowSize; dr++) {
                    for (let dc = 0; dc < windowSize; dc++) {
                        if (grid[r + dr][c + dc] === 0) {
                            zeroMatchesCount++;
                        }
                    }
                }
                if (zeroMatchesCount > maxLocalDamageCluster) {
                    maxLocalDamageCluster = zeroMatchesCount;
                    clusterCenter = { 
                        x: Math.round((c + windowSize / 2) * BLOCK_SIZE), 
                        y: Math.round((r + windowSize / 2) * BLOCK_SIZE) 
                    };
                }
            }
        }

        const threshold = isCompressedChannel ? 16 : 5;

        return {
            maxLocalDamageCluster,
            clusterCenter,
            isLocalTampered: maxLocalDamageCluster >= threshold,
            thresholdUsed: threshold
        };
    }

    function runEngineCore(data, width, height, targetWidth, targetHeight, keyString, isDownscaled) {
        const subSeed = deriveSubSeed(keyString, "PHOTO_DCT16");
        const rng = createPRNG(subSeed);

        let totalActiveAudited = 0;
        let matchedActiveBits = 0;
        let totalGapEnergy = 0.0;
        let count100 = 0, count0 = 0;
        let darkSealedCount = 0;

        const macroblockMap = [];
        const totalPixelsPerBlock = BLOCK_SIZE * BLOCK_SIZE;
        const blockLuma = new Float64Array(totalPixelsPerBlock);
        const dctCoefficients = new Float64Array(totalPixelsPerBlock);

        const scaleX = width / targetWidth;
        const scaleY = height / targetHeight;

        for (let by = 0; by < targetHeight; by += BLOCK_SIZE) {
            for (let bx = 0; bx < targetWidth; bx += BLOCK_SIZE) {
                const isSelected = rng() <= CAMERA_SCATTER_RATIO;
                const expectedBit = rng() > 0.5 ? 1 : 0;

                let blockSumLuma = 0.0;

                if (!isDownscaled) {
                    for (let y = 0; y < BLOCK_SIZE; y++) {
                        const rowIdx = ((by + y) * width + bx) * 4;
                        for (let x = 0; x < BLOCK_SIZE; x++) {
                            const p = rowIdx + (x * 4);
                            const luma = 0.299 * data[p] + 0.587 * data[p + 1] + 0.114 * data[p + 2];
                            blockSumLuma += luma;
                            blockLuma[y * BLOCK_SIZE + x] = luma;
                        }
                    }
                } else {
                    // Exact stride integer sampling (menjaga kontras frekuensi)
                    for (let y = 0; y < BLOCK_SIZE; y++) {
                        const sy = Math.min(height - 1, Math.floor((by + y) * scaleY));
                        const rowOffset = sy * width * 4;

                        for (let x = 0; x < BLOCK_SIZE; x++) {
                            const sx = Math.min(width - 1, Math.floor((bx + x) * scaleX));
                            const p = rowOffset + (sx * 4);

                            const luma = 0.299 * data[p] + 0.587 * data[p + 1] + 0.114 * data[p + 2];
                            blockSumLuma += luma;
                            blockLuma[y * BLOCK_SIZE + x] = luma;
                        }
                    }
                }

                const avgLuma = blockSumLuma / totalPixelsPerBlock;
                const isLumaSafe = (avgLuma >= 15.0 && avgLuma <= 240.0);

                for (let i = 0; i < totalPixelsPerBlock; i++) {
                    blockLuma[i] -= 128.0;
                }
                fastForwardDCT(blockLuma, dctCoefficients);

                if (isSelected && isLumaSafe) {
                    // EVALUASI PASANGAN ORTOGONAL UTAMA (2,0) vs (0,2)
                    const c1 = dctCoefficients[2 * BLOCK_SIZE + 0]; // Baris 2, Kolom 0
                    const c2 = dctCoefficients[0 * BLOCK_SIZE + 2]; // Baris 0, Kolom 2
                    const diff1 = c1 - c2;
                    const matched = ((diff1 > 0 ? 1 : 0) === expectedBit);

                    if (matched) {
                        matchedActiveBits++;
                        count100++;
                    } else {
                        count0++;
                    }

                    totalGapEnergy += Math.abs(diff1);
                    totalActiveAudited++;

                    macroblockMap.push({
                        x: bx,
                        y: by,
                        type: 'active',
                        matches: matched ? 1 : 0
                    });

                } else {
                    darkSealedCount++;
                    if (!isDownscaled) {
                        if (avgLuma > 35.0 && avgLuma < 235.0) {
                            macroblockMap.push({
                                x: bx,
                                y: by,
                                type: 'dark_sealed_tampered',
                                matches: 0
                            });
                            count0++;
                        }
                    } else {
                        macroblockMap.push({
                            x: bx,
                            y: by,
                            type: 'skipped',
                            matches: -1
                        });
                    }
                }
            }
        }

        return {
            activeMatchRate: totalActiveAudited > 0 ? (matchedActiveBits / totalActiveAudited) * 100 : 0,
            matchedActiveBits,
            totalActiveAudited,
            totalGapEnergy,
            count100, count0,
            darkSealedCount,
            macroblockMap
        };
    }

    function processEngine() {
        const rawKeyInput = document.getElementById('keyInput').value.trim();
        const fileInput = document.getElementById('imageInput');
        const resultBox = document.getElementById('resultBox');
        const resultTitle = document.getElementById('resultTitle');
        const resultMeta = document.getElementById('resultMeta');
        const jsonPayload = document.getElementById('jsonPayload');
        const previewContainer = document.getElementById('previewContainer');
        const cropPreview = document.getElementById('cropPreview');
        const heatmapContainer = document.getElementById('heatmapContainer');

        if (!rawKeyInput || !fileInput.files[0]) {
            alert('Pilih berkas citra dan pastikan Master Key terisi!');
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const nativeWidth = img.naturalWidth;
                const nativeHeight = img.naturalHeight;

                const parts = rawKeyInput.split('_');
                const dimParts = parts[parts.length - 1].split('x');
                const canonicalWidth = parseInt(dimParts[0], 10);
                const canonicalHeight = parseInt(dimParts[1], 10);
                const canonicalAspect = canonicalWidth / canonicalHeight;
                const screenAspect = nativeWidth / nativeHeight;

                const canvas = document.getElementById('canvas');
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                canvas.width = nativeWidth;
                canvas.height = nativeHeight;
                ctx.drawImage(img, 0, 0, nativeWidth, nativeHeight);

                const isScreenshot = Math.abs(screenAspect - canonicalAspect) > 0.08;
                const rawData = ctx.getImageData(0, 0, nativeWidth, nativeHeight).data;

                let res, auditMode, activeThreshold;
                let activeSourceCanvas;

                if (isScreenshot) {
                    const bounds = detectCenteredPhotoBounds(nativeWidth, nativeHeight, canonicalAspect);

                    const cropCanvas = document.createElement('canvas');
                    cropCanvas.width = canonicalWidth;
                    cropCanvas.height = canonicalHeight;
                    const cropCtx = cropCanvas.getContext('2d');

                    cropCtx.drawImage(
                        canvas,
                        bounds.x, bounds.y, bounds.w, bounds.h,
                        0, 0, canonicalWidth, canonicalHeight
                    );

                    previewContainer.style.display = 'block';
                    cropPreview.src = cropCanvas.toDataURL('image/jpeg', 0.85);

                    const croppedData = cropCtx.getImageData(0, 0, canonicalWidth, canonicalHeight).data;
                    res = runEngineCore(croppedData, canonicalWidth, canonicalHeight, canonicalWidth, canonicalHeight, rawKeyInput, false);
                    auditMode = `Screenshot Terpotong Simetris (${bounds.w}x${bounds.h})`;
                    activeThreshold = 60.0;
                    activeSourceCanvas = cropCanvas;
                } else {
                    previewContainer.style.display = 'none';
                    const isExactNative = (nativeWidth === canonicalWidth && nativeHeight === canonicalHeight);

                    if (isExactNative) {
                        res = runEngineCore(rawData, nativeWidth, nativeHeight, canonicalWidth, canonicalHeight, rawKeyInput, false);
                        auditMode = `Foto Asli Kamera Murni (${nativeWidth}x${nativeHeight})`;
                        activeThreshold = 85.0;
                    } else {
                        res = runEngineCore(rawData, nativeWidth, nativeHeight, canonicalWidth, canonicalHeight, rawKeyInput, true);
                        auditMode = `Terkonpresi WhatsApp/FB (${nativeWidth}x${nativeHeight} &rarr; Kanonikal ${canonicalWidth}x${canonicalHeight})`;
                        activeThreshold = 65.0;
                    }
                    activeSourceCanvas = canvas;
                }

                globalMacroblockMap = res.macroblockMap;

                const photoBase = document.getElementById('photoBaseCanvas');
                const overlay = document.getElementById('heatmapOverlay');

                photoBase.width = canonicalWidth;
                photoBase.height = canonicalHeight;
                overlay.width = canonicalWidth;
                overlay.height = canonicalHeight;

                const pbCtx = photoBase.getContext('2d');
                pbCtx.drawImage(activeSourceCanvas, 0, 0, canonicalWidth, canonicalHeight);

                heatmapContainer.style.display = 'block';
                const initialOpacity = parseFloat(document.getElementById('opacitySlider').value);
                renderHeatmapLayer(initialOpacity);

                resultBox.style.display = 'block';

                const isExactNative = (nativeWidth === canonicalWidth && nativeHeight === canonicalHeight);
                const isCompressedChannel = !isExactNative && !isScreenshot;
                const clusterAnalysis = detectTamperClusters(res.macroblockMap, canonicalWidth, canonicalHeight, isCompressedChannel);
                const isLocalTampered = clusterAnalysis.isLocalTampered;

                const isOriginAuthentic = res.activeMatchRate >= activeThreshold;

                const totalBlk = res.count100 + res.count0;
                const p100 = totalBlk > 0 ? ((res.count100 / totalBlk) * 100).toFixed(1) : 0;
                const p0 = totalBlk > 0 ? ((res.count0 / totalBlk) * 100).toFixed(1) : 0;

                if (!isOriginAuthentic) {
                    resultBox.className = "result-box invalid";
                    resultTitle.innerHTML = `🔴 BUKAN KAMERA RESMI / KUNCI SALAH (${res.activeMatchRate.toFixed(2)}%)`;
                } else if (isLocalTampered) {
                    resultBox.className = "result-box tampered";
                    resultTitle.innerHTML = `🟡 CORETAN / MANIPULASI MIKRO TERDETEKSI! (${res.count0} blok rusak)`;
                } else {
                    resultBox.className = "result-box valid";
                    resultTitle.innerHTML = `🟢 ASLI & TERVERIFIKASI (${res.activeMatchRate.toFixed(2)}% Aktif)`;
                }

                resultMeta.innerHTML = `
                    <b>Master Key:</b> ${rawKeyInput}<br>
                    <b>Mode Audit:</b> ${auditMode}<br>
                    <b>Lapisan Aktif (1-Bit Orthogonal):</b> ${res.matchedActiveBits.toLocaleString()} / ${res.totalActiveAudited.toLocaleString()} blok (${res.activeMatchRate.toFixed(2)}%)<br>
                    <b>Dark & Highlight Seals:</b> ${res.darkSealedCount.toLocaleString()} blok dikunci alami<br>
                    <b>Analisis Spasial:</b> ${isLocalTampered 
                        ? `<span style="color: #f87171; font-weight: bold;">Terdeteksi kluster kerusakan padat di koordinat X:${clusterAnalysis.clusterCenter.x}, Y:${clusterAnalysis.clusterCenter.y} (${clusterAnalysis.maxLocalDamageCluster} blok rusak berkumpul)!</span>` 
                        : '<span style="color: #34d399;">Kerusakan menyebar wajar (Bebas manipulasi lokal)</span>'}<br>

                    <div class="distribution-box">
                        <b>Kesehatan Makroblok (${totalBlk.toLocaleString()} blok):</b>
                        <div class="bar-container">
                            <div class="bar-100" style="width: ${p100}%;" title="100% Utuh"></div>
                            <div class="bar-0" style="width: ${p0}%;" title="0% Rusak"></div>
                        </div>
                        <span style="color: #34d399;">■ Utuh: ${res.count100} (${p100}%)</span> | 
                        <span style="color: #f87171; font-weight: bold;">■ Rusak (Tamper): ${res.count0} (${p0}%)</span>
                    </div>
                `;

                jsonPayload.innerText = JSON.stringify({
                    audit_status: isOriginAuthentic && !isLocalTampered ? "VERIFIED" : "TAMPER_DETECTED",
                    mode: auditMode,
                    active_match: res.activeMatchRate.toFixed(6),
                    tamper_cluster_detected: isLocalTampered,
                    cluster_damage_peak: clusterAnalysis.maxLocalDamageCluster,
                    tamper_blocks_count: res.count0
                }, null, 2);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(fileInput.files[0]);
    }
</script>

</body>
</html>
